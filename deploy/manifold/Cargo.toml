[package]
name = "manifold-union"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Spike runner: load a blade STL, build the hub as a cylinder, boolean-union them with the Manifold kernel."

[dependencies]
# default-features = off drops the parallel (TBB) build, keeping the container
# build minimal for this spike; the boolean engine is otherwise identical.
manifold3d = { version = "0.4.1", default-features = false }
