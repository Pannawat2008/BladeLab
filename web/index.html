<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BladeLab — Layer 1 &amp; Layer 3 Blade Workbench</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111318;
        color: #e8eaed;
        font: 12.5px/1.45 "Inter", system-ui, -apple-system, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        bottom: 12px;
        width: 390px;
        max-width: calc(100vw - 24px);
        display: flex;
        flex-direction: column;
        background: rgba(18, 21, 27, 0.92);
        border: 1px solid #2b313c;
        border-radius: 10px;
        backdrop-filter: blur(8px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid #262b35;
        background: rgba(25, 29, 37, 0.85);
      }
      .panel-header h1 {
        font-size: 13.5px;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.01em;
      }
      .toolbar {
        display: flex;
        gap: 6px;
      }
      button {
        background: #232832;
        color: #e8eaed;
        border: 1px solid #363d4a;
        border-radius: 5px;
        padding: 4px 8px;
        font-size: 11.5px;
        cursor: pointer;
        transition: background 0.12s, border-color 0.12s;
      }
      button:hover:not(:disabled) {
        background: #2e3543;
        border-color: #4f8bd6;
      }
      button:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }
      .panel-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 10px 14px;
      }
      section {
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid #232833;
      }
      section:last-child {
        margin-bottom: 0;
        padding-bottom: 0;
        border-bottom: none;
      }
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #8b95a7;
        margin-bottom: 8px;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 10px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .field label {
        display: flex;
        justify-content: space-between;
        font-size: 11.5px;
        color: #c3c9d4;
      }
      .scrub-label {
        cursor: ew-resize;
        user-select: none;
        border-bottom: 1px dotted #4a5568;
      }
      .scrub-label:hover {
        color: #9ec5ff;
        border-bottom-color: #5b9bf0;
      }
      .field input[type="number"],
      .field input[type="text"],
      .field select {
        width: 100%;
        background: #161920;
        color: #e8eaed;
        border: 1px solid #2e3440;
        border-radius: 5px;
        padding: 4px 7px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .field input[type="number"]:focus,
      .field input[type="text"]:focus,
      .field select:focus {
        outline: none;
        border-color: #4f8bd6;
      }
      .bind-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 6px 0 8px;
        padding: 5px 8px;
        background: rgba(35, 41, 52, 0.55);
        border: 1px solid #282f3c;
        border-radius: 6px;
        font-size: 11.5px;
      }
      .bind-row label {
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        color: #c3c9d4;
      }
      .bind-row input[type="number"] {
        width: 68px;
        background: #151820;
        color: #e8eaed;
        border: 1px solid #2e3440;
        border-radius: 4px;
        padding: 2px 5px;
        font-size: 11.5px;
      }
      #bezier-svg {
        width: 100%;
        height: 150px;
        background: #14171e;
        border: 1px solid #2c3340;
        border-radius: 6px;
        display: block;
        margin-bottom: 8px;
        touch-action: none;
      }
      .lock-btn {
        padding: 1px 5px;
        font-size: 11px;
        background: transparent;
        border-color: transparent;
      }
      .lock-btn.locked {
        background: rgba(245, 166, 35, 0.2);
        border-color: #f5a623;
        color: #ffd27d;
      }
      .row {
        margin: 7px 0;
      }
      .row label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 2px;
        font-size: 11.5px;
        color: #c3c9d4;
      }
      .row input[type="range"] {
        width: 100%;
      }
      .mode-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      .mode-tabs button.active {
        background: #2b4c7e;
        border-color: #5b9bf0;
        color: #ffffff;
      }
      table.station-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
      }
      table.station-table th {
        text-align: left;
        font-weight: 600;
        color: #8b95a7;
        padding: 4px 4px;
        border-bottom: 1px solid #2b313c;
      }
      table.station-table td {
        padding: 3px 4px;
        border-bottom: 1px solid #1d212a;
      }
      table.station-table tr.overridden {
        background: rgba(79, 139, 214, 0.12);
      }
      table.station-table input[type="number"] {
        width: 68px;
        background: #151820;
        color: #e8eaed;
        border: 1px solid #2c323e;
        border-radius: 4px;
        padding: 2px 5px;
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
      }
      table.station-table tr.overridden input[type="number"] {
        border-color: #4f8bd6;
        color: #9ec5ff;
        font-weight: 600;
      }
      .btn-mini {
        padding: 1px 6px;
        font-size: 11px;
      }
      #error-banner {
        display: none;
        margin: 0 14px 8px;
        padding: 6px 9px;
        border-radius: 6px;
        background: rgba(220, 68, 68, 0.18);
        border: 1px solid #d85858;
        color: #ffb3b3;
        font-size: 11.5px;
      }
      #stats {
        padding: 9px 14px;
        border-top: 1px solid #262b35;
        background: rgba(15, 18, 23, 0.95);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #stats .ok {
        color: #7bd88f;
        font-weight: 600;
      }
      #stats .slow {
        color: #ff9d66;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel">
      <div class="panel-header">
        <h1>BladeLab · Workbench</h1>
        <div class="toolbar">
          <button id="btn-undo" title="Undo (Ctrl+Z)" disabled>↶ Undo</button>
          <button id="btn-redo" title="Redo (Ctrl+Y)" disabled>↷ Redo</button>
          <button id="btn-reset" title="Reset to initial fixture">Reset</button>
        </div>
      </div>

      <div class="panel-scroll">
        <!-- Layer 1: Global Rotor Parameters -->
        <section id="layer1-rotor">
          <div class="section-title">
            <span>Layer 1 · Rotor Parameters</span>
            <span id="rotor-summary">R=600 mm · B=3</span>
          </div>
          <div class="grid-2">
            <div class="field">
              <label for="rotor-radius" class="scrub-label" data-scrub-for="rotor-radius" title="Drag horizontally to scrub (Shift=10×, Alt=0.1×)">Tip Radius R (mm)</label>
              <input id="rotor-radius" type="number" min="100" max="2500" step="10" value="600" />
            </div>
            <div class="field">
              <label for="rotor-hub-radius" class="scrub-label" data-scrub-for="rotor-hub-radius" title="Drag horizontally to scrub (Shift=10×, Alt=0.1×)">Hub Radius r₀ (mm)</label>
              <input id="rotor-hub-radius" type="number" min="10" max="1000" step="5" value="60" />
            </div>
            <div class="field">
              <label for="rotor-blades" class="scrub-label" data-scrub-for="rotor-blades" title="Drag horizontally to scrub">Blades B</label>
              <input id="rotor-blades" type="number" min="1" max="12" step="1" value="3" />
            </div>
            <div class="field">
              <label for="rotor-tsr" class="scrub-label" data-scrub-for="rotor-tsr" title="Drag horizontally to scrub (Shift=10×, Alt=0.1×)">Design TSR λ</label>
              <input id="rotor-tsr" type="number" min="0.5" max="15" step="0.25" value="4.5" />
            </div>
            <div class="field">
              <label for="rotor-wind" class="scrub-label" data-scrub-for="rotor-wind" title="Drag horizontally to scrub (Shift=10×, Alt=0.1×)">Wind Speed (m/s)</label>
              <input id="rotor-wind" type="number" min="1" max="50" step="0.5" value="8.0" />
            </div>
            <div class="field">
              <label for="rotor-stations" class="scrub-label" data-scrub-for="rotor-stations" title="Drag horizontally to scrub">Stations N</label>
              <input id="rotor-stations" type="number" min="3" max="41" step="1" value="11" />
            </div>
          </div>
        </section>

        <!-- Layer 1 / 2: Spanwise Distribution Mode -->
        <section id="layer1-distributions">
          <div class="section-title">
            <span>Layer 1/2 · Chord &amp; Twist Law</span>
          </div>
          <div class="mode-tabs">
            <button id="mode-linear" class="active" type="button">Linear</button>
            <button id="mode-schmitz" type="button">Schmitz</button>
            <button id="mode-bezier" type="button">Bézier</button>
            <button id="mode-formula" type="button">Formula</button>
          </div>

          <div class="bind-row">
            <label for="bind-taper">
              <input id="bind-taper" type="checkbox" />
              Bind Tip = Root × Taper
            </label>
            <input id="taper-ratio" type="number" min="0.1" max="2.0" step="0.05" value="0.5" title="Tip-to-root chord taper ratio" />
          </div>

          <div id="controls-linear">
            <div class="grid-2">
              <div class="field">
                <label for="root-chord" class="scrub-label" data-scrub-for="root-chord" title="Drag horizontally to scrub (Shift=10×, Alt=0.1×)">Root Chord (mm)</label>
                <input id="root-chord" type="number" min="5" max="300" step="1" value="70" />
              </div>
              <div class="field">
                <label for="root-twist" class="scrub-label" data-scrub-for="root-twist" title="Drag horizontally to scrub (Shift=10×, Alt=0.1×)">Root Twist (°)</label>
                <input id="root-twist" type="number" min="-45" max="70" step="0.5" value="20" />
              </div>
            </div>
            <div class="row">
              <label for="twist">Tip twist <span id="twist-val">3°</span></label>
              <input id="twist" type="range" min="0" max="25" step="0.5" value="3" />
            </div>
            <div class="row">
              <label for="chord">Tip chord <span id="chord-val">35 mm</span></label>
              <input id="chord" type="range" min="10" max="120" step="1" value="35" />
            </div>
          </div>

          <div id="controls-schmitz" style="display: none">
            <div class="grid-2">
              <div class="field">
                <label for="schmitz-cl" class="scrub-label" data-scrub-for="schmitz-cl">Design C_l</label>
                <input id="schmitz-cl" type="number" min="0.2" max="2.5" step="0.05" value="1.0" />
              </div>
              <div class="field">
                <label for="schmitz-alpha" class="scrub-label" data-scrub-for="schmitz-alpha">Design α (°)</label>
                <input id="schmitz-alpha" type="number" min="-15" max="25" step="0.5" value="6.0" />
              </div>
            </div>
          </div>

          <div id="controls-bezier" style="display: none">
            <div class="mode-tabs">
              <button id="bezier-target-chord" class="active" type="button">Chord (mm)</button>
              <button id="bezier-target-twist" type="button">Twist (°)</button>
            </div>
            <svg id="bezier-svg" viewBox="0 0 320 150"></svg>
            <table class="station-table">
              <thead>
                <tr>
                  <th>Pt</th>
                  <th>s (0..1)</th>
                  <th>Value</th>
                </tr>
              </thead>
              <tbody id="bezier-points-body"></tbody>
            </table>
          </div>

          <div id="controls-formula" style="display: none">
            <div class="field" style="margin-bottom: 8px">
              <label for="formula-chord">Chord Formula (mm, x=r/R, s=0..1)</label>
              <input id="formula-chord" type="text" value="70 - 35 * s" />
            </div>
            <div class="field">
              <label for="formula-twist">Twist Formula (°, x=r/R, s=0..1)</label>
              <input id="formula-twist" type="text" value="20 - 17 * s" />
            </div>
          </div>
        </section>

        <!-- Layer 3: Per-Station Override Table -->
        <section id="layer3-stations">
          <div class="section-title">
            <span>Layer 3 · Per-Station Table</span>
            <button id="btn-clear-overrides" class="btn-mini" type="button">Clear Overrides</button>
          </div>
          <table class="station-table">
            <thead>
              <tr>
                <th>#</th>
                <th>r/R</th>
                <th>r (mm)</th>
                <th>Chord (mm)</th>
                <th>Twist (°)</th>
                <th title="Lock station against Layer 1/2 edits">🔒</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="station-table-body"></tbody>
          </table>
        </section>
      </div>

      <div id="error-banner"></div>

      <div id="stats">
        <span>update: <span id="ms" class="ok">–</span></span>
        <span><span id="tris">–</span> tris</span>
        <span><span id="vol">–</span> mm³</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
