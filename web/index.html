<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BladeLab — live blade preview</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #14161a;
        color: #e8eaed;
        font: 13px/1.5 system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        width: 260px;
        padding: 12px 14px;
        background: rgba(20, 22, 26, 0.86);
        border: 1px solid #2b2f36;
        border-radius: 8px;
        backdrop-filter: blur(4px);
        user-select: none;
      }
      #panel h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .row {
        margin: 8px 0;
      }
      .row label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 2px;
      }
      .row input[type="range"] {
        width: 100%;
      }
      #stats {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid #2b2f36;
        font-variant-numeric: tabular-nums;
      }
      #stats .ok {
        color: #7bd88f;
      }
      #stats .slow {
        color: #ff9d66;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel">
      <h1>BladeLab · live blade</h1>
      <div class="row">
        <label for="twist">Tip twist <span id="twist-val">3°</span></label>
        <input id="twist" type="range" min="0" max="20" step="0.5" value="3" />
      </div>
      <div class="row">
        <label for="chord">Tip chord <span id="chord-val">35 mm</span></label>
        <input id="chord" type="range" min="20" max="70" step="1" value="35" />
      </div>
      <div id="stats">
        update: <span id="ms" class="ok">–</span> ·
        <span id="tris">–</span> tris ·
        <span id="vol">–</span> mm³
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
