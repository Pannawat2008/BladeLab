[workspace]
resolver = "2"
members = [
    "crates/blade-model",
    "crates/blade-geom",
    "crates/blade-mesh",
    "crates/blade-cad",
    "crates/blade-wasm",
    "crates/blade-cli",
    "crates/blade-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "10"
evalexpr = "11"
proptest = "1"
wasm-bindgen = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
